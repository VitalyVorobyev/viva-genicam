name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Platform-independent gates, off the matrix. Formatting used to run three
  # times and, being first, a whitespace nit could fail the job before any
  # functional gate ran — see the `!cancelled()` note on `build` below.
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Cargo fmt
        run: cargo fmt --all --check

      - name: Distribution boundary regressions
        run: python3 scripts/test-distribution.py

      - name: Install cargo-deny
        if: ${{ !cancelled() }}
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Cargo deny (advisories, licenses, bans, sources)
        if: ${{ !cancelled() }}
        run: cargo deny check

      - name: Install mdBook
        if: ${{ !cancelled() }}
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook

      # mdBook exits 0 even when a page fails to build — a missing
      # `{{#include}}` target logs `[ERROR]` and publishes the page anyway. So
      # the exit code is not the gate; the log is.
      #
      # This does not cover a missing *anchor*, which mdBook renders as an empty
      # code block with no diagnostic whatsoever. The `book_includes` test in
      # `viva-genicam` covers that, and runs under `cargo test` on the matrix.
      - name: Build the book
        if: ${{ !cancelled() }}
        run: |
          mdbook build book 2>&1 | tee mdbook.log
          if grep -q '\[ERROR\]' mdbook.log; then
            echo "::error::mdbook reported errors while building the book"
            exit 1
          fi

      - name: Changelog series file for the workspace version
        # release.yml packs changelog/<major>.<minor>.md into every CLI archive
        # and fails on a tag if it is missing; check it on every pull request
        # instead, where a version bump is reviewed.
        shell: bash
        run: |
          set -euo pipefail
          SERIES="$(sed -n 's/^version = "\([0-9]*\.[0-9]*\)\..*"$/\1/p' Cargo.toml | head -1)"
          test -n "$SERIES"
          if [ ! -f "changelog/${SERIES}.md" ]; then
            echo "::error::changelog/${SERIES}.md is missing for workspace version series ${SERIES}"; exit 1
          fi

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    # Every gate below runs even when an earlier one failed, so a review nit
    # cannot conceal a functional failure. On #72 clippy and fmt failed first
    # and `cargo test` never ran once across eight commits and three CI cycles,
    # hiding a real streaming regression for a day. `!cancelled()` rather than
    # `always()`: a cancelled run should stop, not grind through the rest.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Cargo test
        if: ${{ !cancelled() }}
        run: cargo test --workspace

      # The flags `publish-docs.yml` builds the published API docs with, so a
      # broken intra-doc link fails the PR rather than the deploy on main (CI-08).
      - name: Cargo doc
        if: ${{ !cancelled() }}
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps

  # The GenTL producer as consumers load it (ADR-0031): the .cti driven by a C
  # program compiled against the EMVA's GenTL.h, its port XMLs validated
  # against the GenApi 1.1 schema, then frames acquired through Harvesters —
  # a consumer we did not write, on EMVA's reference GenApi — all against
  # viva-fake-gige. GenTL.h is not in the repository; the script fetches the
  # EMVA's package and checks its SHA-256, and the cache spares emva.org a
  # 135 MB download per run.
  gentl:
    name: GenTL producer
    runs-on: ubuntu-latest
    env:
      GENTL_EMVA_DIR: ${{ github.workspace }}/../emva
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Cache the EMVA header and schema
        uses: actions/cache@v6
        with:
          path: ${{ env.GENTL_EMVA_DIR }}
          key: emva-genicam-package-2026.07-e74b8d98

      - name: Install xmllint
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Pinned: a new Harvesters or GenApi release should change this job
      # in a commit of its own, not from one run to the next.
      - name: Install Harvesters
        run: |
          python -m venv "$RUNNER_TEMP/harvesters"
          "$RUNNER_TEMP/harvesters/bin/python" -m pip install harvesters==1.4.3 genicam==1.6.0 numpy==2.5.4
          echo "HARVESTERS_PYTHON=$RUNNER_TEMP/harvesters/bin/python" >> "$GITHUB_ENV"

      - name: C harness, schema check and Harvesters
        run: scripts/gentl-harness.sh 10

  # Each crate on its own, with each of its features alone (CI-01). The
  # workspace build above unifies features: `viva-camctl` enables `u3v-usb`, so
  # `viva-genicam` with its own defaults (none), or `viva-u3v` without `usb`,
  # was never compiled. `--no-dev-deps` keeps test-only features out of the
  # resolution. `-D warnings` because clippy sees only the unified build, so an
  # import used under one feature alone would otherwise go unnoticed.
  #
  # USB is nusb, pure Rust: no system USB library is needed.
  features:
    name: feature matrix
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-hack
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack@0.6.45

      - name: Check each feature of each crate
        run: cargo hack check --workspace --each-feature --no-dev-deps

  # The declared `rust-version` (CI-03), read from the root Cargo.toml so this
  # job cannot drift from it. Libraries and binaries only: the MSRV is a promise
  # to users, and tests and examples (which also build today) are not part of it.
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read the declared MSRV
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"

      - name: Set up Rust ${{ steps.msrv.outputs.version }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Cargo check
        run: cargo check --workspace --locked

  # Viva Studio browses XML offline through `viva-genapi-xml` and `viva-genapi`
  # (`NullIo`), and docs/design.md promises both compile for the browser. This
  # is the only thing that checks it. Twice: with default features (`fetch`
  # adds the pure-Rust `zip`), and `viva-genapi-xml` without them, which is how
  # `studio/Cargo.toml` takes it. `viva-pfnc`'s pixel conversion promises the
  # same, so it is checked with them.
  wasm:
    name: wasm32
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Cargo check (default features)
        run: cargo check --locked --target wasm32-unknown-unknown -p viva-genapi-xml -p viva-genapi -p viva-pfnc

      - name: Cargo check (viva-genapi-xml without default features)
        if: ${{ !cancelled() }}
        run: cargo check --locked --target wasm32-unknown-unknown -p viva-genapi-xml --no-default-features

  # GVSP datagrams are remote input: a camera, or anything else on the link,
  # decides every byte the receive engine parses (CI-09). A short run per
  # target on each pull request catches a panic the scripted tests did not
  # think of; longer campaigns run locally (`fuzz/Cargo.toml` says how).
  fuzz:
    name: fuzz (GVSP)
    runs-on: ubuntu-latest
    env:
      # The prebuilt cargo-fuzz is a musl binary and defaults to its own
      # target, where AddressSanitizer refuses a statically linked libc.
      FUZZ_TARGET: x86_64-unknown-linux-gnu
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust (nightly, which cargo-fuzz needs)
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      - name: Build the fuzz targets
        run: cargo fuzz build --target "$FUZZ_TARGET"

      - name: Fuzz GVSP parsing for 60 s
        run: cargo fuzz run --target "$FUZZ_TARGET" gvsp_parse -- -max_total_time=60

      - name: Fuzz block assembly for 60 s
        if: ${{ !cancelled() }}
        run: cargo fuzz run --target "$FUZZ_TARGET" gvsp_assemble -- -max_total_time=60

      - name: Fuzz chunk parsing for 60 s
        if: ${{ !cancelled() }}
        run: cargo fuzz run --target "$FUZZ_TARGET" chunk_parse -- -max_total_time=60
