name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Platform-independent gates, off the matrix. Formatting used to run three
  # times and, being first, a whitespace nit could fail the job before any
  # functional gate ran — see the `!cancelled()` note on `build` below.
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Cargo fmt
        run: cargo fmt --all --check

      - name: Install cargo-deny
        if: ${{ !cancelled() }}
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Cargo deny (advisories, licenses, bans, sources)
        if: ${{ !cancelled() }}
        run: cargo deny check

      - name: Install mdBook
        if: ${{ !cancelled() }}
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook

      # mdBook exits 0 even when a page fails to build — a missing
      # `{{#include}}` target logs `[ERROR]` and publishes the page anyway. So
      # the exit code is not the gate; the log is.
      #
      # This does not cover a missing *anchor*, which mdBook renders as an empty
      # code block with no diagnostic whatsoever. The `book_includes` test in
      # `viva-genicam` covers that, and runs under `cargo test` on the matrix.
      - name: Build the book
        if: ${{ !cancelled() }}
        run: |
          mdbook build book 2>&1 | tee mdbook.log
          if grep -q '\[ERROR\]' mdbook.log; then
            echo "::error::mdbook reported errors while building the book"
            exit 1
          fi

      - name: Changelog series file for the workspace version
        # release.yml packs changelog/<major>.<minor>.md into every CLI archive
        # and fails on a tag if it is missing; check it on every pull request
        # instead, where a version bump is reviewed.
        shell: bash
        run: |
          set -euo pipefail
          SERIES="$(sed -n 's/^version = "\([0-9]*\.[0-9]*\)\..*"$/\1/p' Cargo.toml | head -1)"
          test -n "$SERIES"
          if [ ! -f "changelog/${SERIES}.md" ]; then
            echo "::error::changelog/${SERIES}.md is missing for workspace version series ${SERIES}"; exit 1
          fi

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    # Every gate below runs even when an earlier one failed, so a review nit
    # cannot conceal a functional failure. On #72 clippy and fmt failed first
    # and `cargo test` never ran once across eight commits and three CI cycles,
    # hiding a real streaming regression for a day. `!cancelled()` rather than
    # `always()`: a cancelled run should stop, not grind through the rest.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Cargo test
        if: ${{ !cancelled() }}
        run: cargo test --workspace

      # The flags `publish-docs.yml` builds the published API docs with, so a
      # broken intra-doc link fails the PR rather than the deploy on main (CI-08).
      - name: Cargo doc
        if: ${{ !cancelled() }}
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps

  # Each crate on its own, with each of its features alone (CI-01). The
  # workspace build above unifies features: `viva-camctl` enables `u3v-usb`, so
  # `viva-genicam` with its own defaults (none), or `viva-u3v` without `usb`,
  # was never compiled. `--no-dev-deps` keeps test-only features out of the
  # resolution. `-D warnings` because clippy sees only the unified build, so an
  # import used under one feature alone would otherwise go unnoticed.
  #
  # No system libusb is installed: without one, libusb1-sys builds its bundled
  # source (netlink hotplug on Linux), as it already does for the matrix above.
  features:
    name: feature matrix
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-hack
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack@0.6.45

      - name: Check each feature of each crate
        run: cargo hack check --workspace --each-feature --no-dev-deps

  # The declared `rust-version` (CI-03), read from the root Cargo.toml so this
  # job cannot drift from it. Libraries and binaries only: the MSRV is a promise
  # to users, and tests and examples (which also build today) are not part of it.
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read the declared MSRV
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"

      - name: Set up Rust ${{ steps.msrv.outputs.version }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Cargo check
        run: cargo check --workspace --locked

  # Viva Studio browses XML offline through `viva-genapi-xml` and `viva-genapi`
  # (`NullIo`), and docs/design.md promises both compile for the browser. This
  # is the only thing that checks it. Twice: with default features (`fetch`
  # adds the pure-Rust `zip`), and `viva-genapi-xml` without them, which is how
  # `studio/Cargo.toml` takes it.
  wasm:
    name: wasm32
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Cargo check (default features)
        run: cargo check --locked --target wasm32-unknown-unknown -p viva-genapi-xml -p viva-genapi

      - name: Cargo check (viva-genapi-xml without default features)
        if: ${{ !cancelled() }}
        run: cargo check --locked --target wasm32-unknown-unknown -p viva-genapi-xml --no-default-features
