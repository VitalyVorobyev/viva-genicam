name: Publish Rust crates (crates.io)

on:
  push:
    tags:
      - "v*"
  # Resume a release that stopped partway. Every step below is idempotent, so a
  # re-run publishes only what crates.io does not already have. A plain re-run
  # of the failed tag run cannot do that: it replays that run's workflow file.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to (re)publish, e.g. v0.6.0"
        required: true

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      id-token: write
      contents: read

    environment: crates-io

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Verify versions match tag (vX.Y.Z)
        run: |
          TAG="${RELEASE_TAG#v}"
          WS_VER=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c "
          import sys, json
          pkgs = json.load(sys.stdin)['packages']
          root = next(p for p in pkgs if p['name'] == 'viva-genicam')
          print(root['version'])
          ")
          echo "tag version:       $TAG"
          echo "workspace version: $WS_VER"
          if [ "$TAG" != "$WS_VER" ]; then
            echo "::error::Tag version ($TAG) does not match workspace version ($WS_VER)"
            exit 1
          fi

      - name: Guard first release (manual publish required once)
        run: |
          set -euo pipefail
          STATUS=$(curl -sS -o /dev/null -w '%{http_code}' \
            -A "viva-genicam-ci/${GITHUB_RUN_ID}" \
            "https://index.crates.io/vi/va/viva-gencp")

          if [ "$STATUS" = "404" ]; then
            echo "::error title=First release requires manual publish::None of the viva-* crates exist on crates.io yet. Trusted Publishing cannot perform the first publish. Run the publish commands locally with a scoped token, then use this workflow for subsequent tags."
            exit 1
          fi

          if [ "$STATUS" != "200" ]; then
            echo "::warning title=crates.io index check skipped::Could not verify crate existence (HTTP $STATUS). Continuing; cargo will perform final validation."
          fi

      - name: Test workspace
        run: cargo test --workspace

      - name: Authenticate to crates.io via Trusted Publishing (OIDC)
        id: cratesio
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.cratesio.outputs.token }}
        run: |
          set -euo pipefail

          VERSION="${RELEASE_TAG#v}"

          # The sparse-index path of a crate name of four or more characters.
          index_url() {
            echo "https://index.crates.io/${1:0:2}/${1:2:2}/$1"
          }

          on_index() {
            curl -fsS -A "viva-genicam-ci/${GITHUB_RUN_ID}" "$(index_url "$1")" 2>/dev/null \
              | grep -q "\"vers\":\"${VERSION}\""
          }

          publish() {
            if on_index "$1"; then
              echo "$1 ${VERSION} is already on crates.io; skipping."
              return
            fi
            echo "::group::Publishing $1"
            cargo publish -p "$1" --locked
            echo "::endgroup::"
            # Wait for the index rather than for a fixed time. 0.6.0 stopped
            # after nine crates because viva-pfnc took longer than a flat 30 s
            # to appear, and the next crate could not resolve `^0.6` against it.
            for _ in $(seq 1 60); do
              on_index "$1" && return
              sleep 10
            done
            echo "::error::$1 ${VERSION} did not appear on the crates.io index within 10 minutes"
            exit 1
          }

          # Level 0: no internal dependencies
          publish viva-gencp
          publish viva-pfnc
          publish viva-sfnc
          publish viva-genapi-xml
          publish viva-zenoh-api

          # Level 1: single internal dependency
          publish viva-genapi
          publish viva-gige
          publish viva-u3v

          # Level 2: facade (depends on all above)
          publish viva-genicam

          # Level 3: service layer
          publish viva-service

          # Level 4: CLI (depends on all libraries)
          publish viva-camctl

          echo "All 11 crates published successfully."
