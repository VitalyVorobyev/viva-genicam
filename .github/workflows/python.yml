name: Python wheels

on:
  push:
    branches: [main]
    tags: ['py-v*']
  pull_request:
    # Every crate the wheel builds from: viva-pygenicam's path dependencies and
    # theirs (`cargo metadata` in crates/viva-pygenicam lists them). Keep this in
    # step when that graph changes (CI-07).
    paths:
      - 'crates/viva-pygenicam/**'
      # The wheel installs a `viva-camctl` console script backed by this crate,
      # so a change to the CLI can break the wheel.
      - 'crates/viva-camctl/**'
      - 'crates/viva-genicam/**'
      - 'crates/viva-genapi*/**'
      - 'crates/viva-gencp/**'
      - 'crates/viva-gige/**'
      - 'crates/viva-u3v/**'
      - 'crates/viva-pfnc/**'
      - 'crates/viva-sfnc/**'
      # A dependency of the wheel, and the camera the `test` job runs against.
      - 'crates/viva-fake-gige/**'
      # The path dependencies inherit `[workspace.package]` and
      # `[workspace.dependencies]` from the root manifest, and the `test` job
      # builds viva-fake-gige against the root lockfile.
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/python.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # `viva-pygenicam` is excluded from the root workspace, so
  # `cargo fmt --all` / `cargo clippy --workspace` in `ci.yml` never reach it.
  # Nothing linted it until this job: it had drifted out of rustfmt in 35
  # places, carried two clippy findings, and its separate `Cargo.lock` went
  # stale for a whole PR without anything noticing (CI-02).
  lint:
    name: lint viva-pygenicam
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/viva-pygenicam

      - name: Cargo fmt
        working-directory: crates/viva-pygenicam
        run: cargo fmt --check

      # `--locked` is the part that catches a stale lockfile. `--all-targets`
      # would need a Python interpreter to link the cdylib against, so lint the
      # lib alone with the feature maturin builds it with.
      - name: Cargo clippy
        if: ${{ !cancelled() }}
        working-directory: crates/viva-pygenicam
        run: cargo clippy --locked --lib --features pyo3/extension-module -- -D warnings

  build:
    name: wheel ${{ matrix.target }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            python: '3.12'
          - os: macos-15
            target: aarch64-apple-darwin
            python: '3.12'
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            python: '3.12'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      # libusb is statically linked into the extension via `rusb/vendored`,
      # so no system libusb needs to be installed on any platform.
      # For Linux we specify `manylinux` + `container` as action inputs so
      # the action spins up the matching manylinux docker image (the runner
      # itself has glibc ≥2.38 which would emit non-compliant symbols).
      - name: Build wheel (abi3)
        uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/viva-pygenicam
          target: ${{ matrix.target }}
          manylinux: ${{ startsWith(matrix.os, 'ubuntu') && '2_28' || 'auto' }}
          container: ${{ startsWith(matrix.os, 'ubuntu') && 'quay.io/pypa/manylinux_2_28_x86_64' || '' }}
          args: --release --out dist

      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.target }}
          path: crates/viva-pygenicam/dist/*.whl

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/viva-pygenicam
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: crates/viva-pygenicam/dist/*.tar.gz

  test:
    name: test ${{ matrix.os }} py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    needs: [build]
    # One shell on every runner: on Windows the default, PowerShell, reports
    # only the last command's exit code of a multi-line step.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        # Windows too: the wheel is built and published for it (CI-04), and
        # #57 was a Windows report.
        os: [ubuntu-latest, macos-15, windows-latest]
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Build fake camera
        run: cargo build -p viva-fake-gige --release
      - name: Download wheel
        uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - name: Install wheel + test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pytest
          python -m pip install --no-index --find-links dist viva-genicam
      - name: Console script works
        # `pip install viva-genicam` must give the diagnostic CLI we ask
        # reporters to run. Checked as its own step so a failure here is
        # unambiguous rather than one line in a pytest trace.
        run: |
          viva-camctl --version
          viva-camctl report --help

      - name: Run pytest against installed wheel
        run: python -m pytest crates/viva-pygenicam/tests -v

      # The stubs are hand-written, so check them against the module the wheel
      # built (PY-04): a method added, renamed or re-typed in Rust without its
      # stub fails here. The whole package, so a facade calling something the
      # stub lacks fails too. Run from the repository root, where
      # `viva_genicam` resolves to the installed wheel.
      - name: Check the type stubs (stubtest)
        if: ${{ !cancelled() }}
        run: |
          python -m pip install "mypy>=2.4"
          python -m mypy.stubtest viva_genicam --allowlist crates/viva-pygenicam/stubtest-allowlist.txt

  publish:
    name: publish to PyPI
    runs-on: ubuntu-latest
    needs: [build, sdist, test]
    if: startsWith(github.ref, 'refs/tags/py-v')
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true
