name: Studio CI

# Studio builds against the library crates through path dependencies, so a
# library-only change can break it: #105 did, and nothing ran until #106
# repaired main (ADR-0024 amends ADR-0017 here).
on:
  push:
    branches: [ main ]
    paths:
      - "studio/**"
      - "crates/**"
      - "Cargo.toml"
      - ".github/workflows/studio-ci.yml"
  pull_request:
    paths:
      - "studio/**"
      - "crates/**"
      - "Cargo.toml"
      - ".github/workflows/studio-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: studio

      # `!cancelled()` so a formatting nit cannot hide a failing test — the
      # same masking `ci.yml` had, and the same fix.
      - name: Cargo fmt
        working-directory: studio
        run: cargo fmt --all --check

      - name: Cargo clippy
        if: ${{ !cancelled() }}
        working-directory: studio
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Cargo test
        if: ${{ !cancelled() }}
        working-directory: studio
        run: cargo test --workspace

  # The Tauri app is `exclude`d from the studio workspace (it builds via
  # `cargo tauri`), so the `rust` job above never reaches it, and the bundles
  # are built only by `release.yml`. That left the entire Tauri backend — every
  # command handler and the whole camera-session lifecycle — with no PR-time
  # gate: #81 deleted the code behind a `use` there and the dead import sat on
  # `main` unnoticed. Linting it needs no frontend build, so it is cheap.
  tauri-lint:
    # Every OS Studio users run it on. The known reporters are on Windows 11
    # and Ubuntu 24.04, where this job never used to compile the app.
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-latest, ubuntu-24.04, windows-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Pinned to 24.04 so the package name cannot drift under ubuntu-latest.
      - name: Install WebKitGTK
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: studio/apps/viva-studio-tauri/src-tauri

      - name: Cargo fmt
        if: runner.os == 'Linux'
        working-directory: studio/apps/viva-studio-tauri/src-tauri
        run: cargo fmt --all --check

      - name: Cargo clippy
        if: ${{ !cancelled() }}
        working-directory: studio/apps/viva-studio-tauri/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      # The crate's tests were run by no job until this one: it is excluded from
      # the studio workspace (`studio/Cargo.toml`), so `cargo test --workspace`
      # never reaches it. Two of them drive the embedded backend against
      # viva-fake-gige on UDP 3956 and serialise on a lock.
      - name: Cargo test
        if: ${{ !cancelled() }}
        working-directory: studio/apps/viva-studio-tauri/src-tauri
        run: cargo test

  ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      # Vitest's binary runs under Node even when bun starts it, and jsdom 30
      # (the component tests' DOM) needs Node 22.22.2 or later.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        working-directory: studio/ui/viva-studio-ui
        run: bun install --frozen-lockfile

      # `bun run build` is Vite, which strips types without checking them, so
      # until this step existed nothing in CI type-checked the frontend at all
      # and 14 real errors accumulated on main (ST-20).
      - name: Type check
        working-directory: studio/ui/viva-studio-ui
        run: bunx tsc --noEmit

      # Oxlint (`.oxlintrc.json`): ESLint's and typescript-eslint's recommended
      # rules, and the React hooks and React Compiler rules.
      - name: Lint
        if: ${{ !cancelled() }}
        working-directory: studio/ui/viva-studio-ui
        run: bun run lint

      - name: Test
        if: ${{ !cancelled() }}
        working-directory: studio/ui/viva-studio-ui
        run: bun run test -- --run

      - name: Build
        if: ${{ !cancelled() }}
        working-directory: studio/ui/viva-studio-ui
        run: bun run build
