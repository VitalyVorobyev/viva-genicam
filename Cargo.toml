[workspace]
members = [
  "crates/viva-gencp",
  "crates/viva-genapi-xml",
  "crates/viva-genapi",
  "crates/viva-gige",
  "crates/viva-u3v",
  "crates/viva-pfnc",
  "crates/viva-sfnc",
  "crates/viva-genicam",
  "crates/viva-camctl",
  "crates/viva-zenoh-api",
  "crates/viva-service",
  "crates/viva-fake-gige",
  "crates/viva-fake-u3v",
  "crates/viva-service-u3v",
  "crates/viva-gentl",
]
exclude = ["crates/viva-pygenicam", "studio", "fuzz"]
resolver = "3"

[workspace.package]
version = "0.11.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/VitalyVorobyev/viva-genicam"
rust-version = "1.88"
keywords = ["genicam", "vision", "gige", "camera"]
categories = ["hardware-support", "network-programming", "science::robotics"]

# The library crates' public surface is documented, and public on purpose
# (ADR-0030). Binaries and the fake cameras do not opt in.
[workspace.lints.rust]
missing_docs = "warn"
unreachable_pub = "warn"
# viva-genicam's receive engine is built for the fuzz targets in `fuzz/`.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[workspace.dependencies]
thiserror = "2"
bytes = "1"
bitflags = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync"] }
quick-xml = "0.42"
# GenICam XML is often served as a ZIP archive from the camera itself, so this
# is on the connect path of every transport rather than a dev convenience.
zip = { version = "9", default-features = false, features = ["deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nusb = "0.2.7"
# For net utils:
if-addrs = { version = "0.15", features = ["link-local"] }
async-trait = "0.1"
socket2 = "0.6"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
time = "0.3"
