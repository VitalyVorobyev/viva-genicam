[package]
name = "viva-camctl"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "CLI tool for GenICam camera discovery, feature control, and streaming"
readme = "README.md"
keywords = ["genicam", "vision", "gige", "u3v", "cli"]
categories = ["hardware-support", "command-line-utilities"]

[dependencies]
clap = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true, features = ["macros", "signal"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
serde = { workspace = true }
serde_json = { workspace = true }
bytes = { workspace = true }
time = { workspace = true, features = ["formatting"] }

viva-genicam = { version = "0.11", path = "../viva-genicam", features = ["u3v-usb", "image-io"] }
viva-gige = { version = "0.11", path = "../viva-gige" }
viva-sfnc = { version = "0.11", path = "../viva-sfnc" }
viva-pfnc = { version = "0.11", path = "../viva-pfnc" }
viva-genapi-xml = { version = "0.11", path = "../viva-genapi-xml" }
viva-u3v = { version = "0.11", path = "../viva-u3v", features = ["usb"] }

[dev-dependencies]
viva-fake-gige = { path = "../viva-fake-gige" }
socket2 = { workspace = true }
viva-fake-u3v = { path = "../viva-fake-u3v" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
