[package]
name = "viva-genapi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "In-memory GenApi node map, evaluation, and feature access helpers"
readme = "README.md"
keywords = ["genicam", "genapi", "vision", "camera"]
categories = ["hardware-support", "science::robotics"]


[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
bytes = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
viva-genapi-xml = { version = "0.8", path = "../viva-genapi-xml" }

[dev-dependencies]
# The corpus test finds port-bound registers with a reader of its own, so it
# can disagree with `viva-genapi-xml` about which registers those are.
quick-xml = { workspace = true }
bytes = { workspace = true }
