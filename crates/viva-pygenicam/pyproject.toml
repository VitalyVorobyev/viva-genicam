[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "viva-genicam"
version = "0.11.0"
description = "Pure-Rust GenICam stack for Python: discover, control, and stream GigE Vision / USB3 Vision cameras"
readme = "README.md"
# USB3 Vision goes through nusb (pure Rust, MIT OR Apache-2.0), so the wheel
# links no LGPL code since 0.9 (ADR-0032).
license = { text = "MIT" }
authors = [
    { name = "Vitaly Vorobyev" },
]
requires-python = ">=3.10"
keywords = ["genicam", "gige", "usb3-vision", "camera", "vision"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Multimedia :: Graphics :: Capture",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy>=1.23",
]

[project.scripts]
# The Rust CLI, linked into the extension module rather than shipped as a
# separate per-target binary: one artifact, and the console script comes from
# the same entry-point mechanism whether the install is from a wheel or built
# from the sdist.
viva-camctl = "viva_genicam._camctl:main"

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "maturin>=1.7",
]

[project.urls]
Homepage = "https://github.com/VitalyVorobyev/viva-genicam"
Repository = "https://github.com/VitalyVorobyev/viva-genicam"
Documentation = "https://vitalyvorobyev.github.io/viva-genicam/"

[tool.maturin]
module-name = "viva_genicam._native"
python-source = "python"
features = ["pyo3/extension-module"]
# Generated for the build target before packaging (see docs/legal-review.md).
include = [{ path = "viva_genicam/THIRD_PARTY_NOTICES.txt", format = ["wheel", "sdist"] }]
