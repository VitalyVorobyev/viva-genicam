[package]
name = "viva-zenoh-api"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Message payloads and topic names published by the viva GenICam camera services - plain serde types that do not link Zenoh"
readme = "README.md"
keywords = ["genicam", "zenoh", "vision", "camera"]
categories = ["hardware-support", "network-programming"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
# `From<viva_genapi::FeatureState>` for the wire `FeatureState`, for services
# that read features through `viva-genapi`. Off by default: a client needs only
# the payload types.
genapi = ["dep:viva-genapi"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
viva-genapi = { version = "0.7", path = "../viva-genapi", optional = true }
