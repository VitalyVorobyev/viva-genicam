[package]
name = "viva_studio_tauri"
version = "0.8.0"
description = "Viva Studio desktop app"
edition = "2024"
build = "build.rs"

[dependencies]
# Tauri v2.
# Frontend JS bindings live in `@tauri-apps/api` (also v2); keep both in sync.
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
async-trait = "0.1"
bytes = "1"
dirs = "7"
viva-genicam = { path = "../../../../crates/viva-genicam", features = ["u3v-usb"] }
viva_streamer = { path = "../../../crates/viva_streamer" }
viva_xml_model = { path = "../../../crates/viva_xml_model" }
viva-zenoh-api = { path = "../../../../crates/viva-zenoh-api", features = ["genapi"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "net", "rt-multi-thread"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zenoh = "1"

[dev-dependencies]
futures-util = "0.3"
# The UI's TypeScript types are generated from the Rust ones (`src/bindings.rs`,
# backlog ST-28); test builds turn on the `ts` derives below.
ts-rs = { version = "12.0.1", features = ["no-serde-warnings", "serde-json-impl"] }
viva-zenoh-api = { path = "../../../../crates/viva-zenoh-api", features = ["genapi", "ts"] }
viva_xml_model = { path = "../../../crates/viva_xml_model", features = ["ts"] }
# Reads `permissions/*.toml` in the ACL test, and sends IPC calls through
# Tauri's ACL on its mock runtime.
tauri = { version = "2", features = ["test"] }
toml = "1"
# The image WebSocket's client side, for the frame-delivery tests.
tokio-tungstenite = "0.30"
viva-fake-gige = { path = "../../../../crates/viva-fake-gige" }
viva-fake-u3v = { path = "../../../../crates/viva-fake-u3v" }
# The service, run in-process for the remote-mode tests.
viva-service = { path = "../../../../crates/viva-service" }

[build-dependencies]
tauri-build = { version = "2", features = [] }
