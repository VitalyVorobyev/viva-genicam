[package]
name = "viva_studio_tauri"
version = "0.1.0"
description = "Viva Studio desktop app"
edition = "2024"
build = "build.rs"

[dependencies]
# Tauri v2.
# Frontend JS bindings live in `@tauri-apps/api` (also v2); keep both in sync.
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
async-trait = "0.1"
bytes = "1"
dirs = "7"
viva-genicam = { path = "../../../../crates/viva-genicam", features = ["u3v-usb"] }
viva_streamer = { path = "../../../crates/viva_streamer" }
viva_xml_model = { path = "../../../crates/viva_xml_model" }
viva-zenoh-api = { path = "../../../../crates/viva-zenoh-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "net", "rt-multi-thread"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zenoh = "1"

[dev-dependencies]
viva-genapi-xml = { path = "../../../../crates/viva-genapi-xml" }

[build-dependencies]
tauri-build = { version = "2", features = [] }
